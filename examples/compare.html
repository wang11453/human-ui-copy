<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>human-ui-copy · before / after</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #14141a; color: #e8e8ef; font: 15px/1.5 system-ui, "Segoe UI", sans-serif; }
  .bar { display: flex; align-items: center; gap: 16px; padding: 10px 18px; background: #1c1c24; border-bottom: 1px solid #2a2a35; }
  .bar b { color: #fff; }
  .bar span { color: #9a9aa8; }
  .bar a { color: #7ea6ff; text-decoration: none; margin-left: auto; }
  .frame { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; height: calc(100% - 49px); background: #2a2a35; }
  .pane { position: relative; background: #fff; overflow: hidden; }
  .tag {
    position: absolute; top: 0; left: 0; z-index: 2;
    padding: 6px 14px; font: 600 12px/1 system-ui; letter-spacing: .08em;
    color: #fff; background: #b3441f;
  }
  .pane.right .tag { background: #2c6e49; }
  .pane iframe { width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
  <div class="bar">
    <b>human-ui-copy</b>
    <span>same product, same content — left: the template version, right: after the seven-step transform</span>
    <a href="WALKTHROUGH.md">walkthrough →</a>
  </div>
  <div class="frame">
    <div class="pane left">
      <div class="tag">BEFORE · template.html</div>
      <iframe src="template.html" title="template version"></iframe>
    </div>
    <div class="pane right">
      <div class="tag">AFTER · human.html</div>
      <iframe src="human.html" title="transformed version"></iframe>
    </div>
  </div>
</body>
</html>
